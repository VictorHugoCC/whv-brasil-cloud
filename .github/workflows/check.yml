name: checa cota WHV Brasil

on:
  schedule:
    - cron: "*/5 * * * *"   # mínimo que o GitHub aceita; na prática às vezes atrasa alguns minutos
  workflow_dispatch:         # botão "Run workflow" para testar na mão

permissions:
  contents: write            # para commitar o state.json

concurrency:
  group: whv-check           # nunca duas rodadas ao mesmo tempo brigando pelo state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: checa o site
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: salva o estado (e mantém o repo "ativo")
        run: |
          git config user.name  "whv-bot"
          git config user.email "whv-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "estado: $(cat state.json)"
            git push
          # o GitHub desliga agendamentos de repo sem commit há 60 dias — um commit vazio a cada 30 dias evita isso
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git commit --allow-empty -m "keepalive"
            git push
          fi
